function freeTileIn(r){for(let k=0;k<80;k++){const x=rr(r.x,r.x+r.w-1),y=rr(r.y,r.y+r.h-1);if(tileFree(x,y))return {x,y};}return null;}

function corridor(map,w,a,b,dir){
 const carve=(x,y)=>{const i=y*w+x;if(map[i]===0)map[i]=2;};
 if(dir==='h'){const x0=a.x+a.w,y0=rr(a.y,a.y+a.h-1),x1=b.x-1,y1=rr(b.y,b.y+b.h-1);const mx=x1-x0>=2?rr(x0+1,x1-1):x0;
  for(let x=x0;x<=mx;x++)carve(x,y0);for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)carve(mx,y);for(let x=mx;x<=x1;x++)carve(x,y1);}
 else{const y0=a.y+a.h,x0=rr(a.x,a.x+a.w-1),y1=b.y-1,x1=rr(b.x,b.x+b.w-1);const my=y1-y0>=2?rr(y0+1,y1-1):y0;
  for(let y=y0;y<=my;y++)carve(x0,y);for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)carve(x,my);for(let y=my;y<=y1;y++)carve(x1,y);}}

function mkMon(T,f,x,y){f=Math.min(f,25);const k=(T.sen?(1+0.006*Math.max(0,((G&&G.floor)||50)-50)):(1+0.06*Math.max(0,f-T.min)))*[0.72,1,1.28][dif()];return {t:T.id,x,y,hp:Math.round(T.hp*k),maxHp:Math.round(T.hp*k),atk:Math.round(T.atk*k),def:Math.round(T.def*k),exp:Math.round(T.exp*k),sleep:0,deep:false,aware:false,lost:0,flee:0,loot:null,gold:0};}

function genFloor(f){
 const realF=f;f=Math.min(f,25);

 const NC=realF>=80?1:realF>=55?2:3,GXS=NC===3?[0,1,2]:NC===2?[0,1]:[1],XO=NC===2?9:0,MXW=realF>=30?Math.max(4,12-Math.floor((realF-30)/9)):12,MNR=NC===1?3:NC===2?4:5;
 for(let gy=0;gy<3;gy++)for(const gx of GXS){let r;const ox=gx*cw+XO;
  if(NC>1&&chance(0.18))r={x:ox+rr(4,cw-5),y:gy*ch+rr(3,ch-4),w:1,h:1,dummy:true};
  else{const rw=rr(4,MXW),rh=rr(3,6);r={x:ox+rr(2,cw-rw-2),y:gy*ch+rr(2,ch-rh-2),w:rw,h:rh};}
  r.gx=gx;r.gy=gy;cells.push(r);}
 while(cells.filter(r=>!r.dummy).length<MNR){const d=pick(cells.filter(r=>r.dummy));const rw=rr(4,Math.min(10,MXW)),rh=rr(3,6),ox=d.gx*cw+XO;Object.assign(d,{x:ox+rr(2,cw-rw-2),y:d.gy*ch+rr(2,ch-rh-2),w:rw,h:rh,dummy:false});}
 cells.forEach(r=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)map[y*w+x]=r.dummy?2:1;});
 const edges=[];for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){const A=cells[i],B=cells[j];if(A.gy===B.gy&&Math.abs(A.gx-B.gx)===1)edges.push([i,j,'h']);else if(A.gx===B.gx&&Math.abs(A.gy-B.gy)===1)edges.push([i,j,'v']);}
 const par=[...Array(cells.length).keys()];const find=a=>par[a]===a?a:(par[a]=find(par[a]));
 for(const e of shuffle(edges)){const a=find(e[0]),b=find(e[1]);if(a!==b){par[a]=b;corridor(map,w,cells[e[0]],cells[e[1]],e[2]);}else if(chance(0.22))corridor(map,w,cells[e[0]],cells[e[1]],e[2]);}
 Object.assign(G,{w,h,map,rooms:cells.filter(r=>!r.dummy),exp:new Array(w*h).fill(0),items:[],mons:[],traps:[],stairs:null,light:null,mapped:false,bookTaken:false,mhOn:false});
 const pr=pick(G.rooms);G.p.x=-9;G.p.y=-9;const pt=freeTileIn(pr);G.p.x=pt.x;G.p.y=pt.y;
 {const others=G.rooms.filter(r=>r!==pr);G.stairs=freeTileIn(others.length?pick(others):pr);}
 let mh=null;
 if(f>=3&&f<25&&chance(0.16)){const c=G.rooms.filter(r=>r!==pr&&r.w*r.h>=12&&!(G.stairs&&G.stairs.x>=r.x&&G.stairs.x<r.x+r.w&&G.stairs.y>=r.y&&G.stairs.y<r.y+r.h));if(c.length){mh=pick(c);mh.mh=true;}}
 const placeAny=(obj,room)=>{const t=room?freeTileIn(room):randFree((t,r)=>!r.mh);if(t)G.items.push(Object.assign({x:t.x,y:t.y},obj));};
 const goldAmt=()=>rr(8,22)+f*rr(6,12);
 for(let i=rr(5,8);i>0;i--)placeAny({item:randItem(f)});
 for(let i=rr(2,4);i>0;i--)placeAny({gold:goldAmt()});
 const tk=['spike','sleep','hungry','warp','bark'];if(f<25)tk.push('spring','spring');if(f>=4)tk.push('rust');
 for(let i=rr(1,3)+Math.floor(f/5);i>0;i--){const t=randFree((t,r)=>!r.mh&&cheb(t,G.p)>1);if(t)G.traps.push({x:t.x,y:t.y,k:pick(tk),seen:false});}
 for(let i=rr(4,6)+Math.floor(f/6);i>0;i--)spawnMon(f,{far:true,sleep:chance(0.3)});
 if(mh){const area=mh.w*mh.h;const n=clamp(Math.floor(area*0.35),6,16);
  for(let i=0;i<n;i++){const t=freeTileIn(mh);if(t){const m=mkMon(pickMonType(f),f,t.x,t.y);m.sleep=999;m.deep=true;G.mons.push(m);}}

  const cx=far.x+Math.floor(far.w/2),cy=far.y+Math.floor(far.h/2);const bt=tileFree(cx,cy)?{x:cx,y:cy}:freeTileIn(far);

function computeVis(){
 const w=G.w,p=G.p;vis=new Uint8Array(w*G.h);
 const mark=(x,y)=>{if(x<0||y<0||x>=w||y>=G.h)return;const i=y*w+x;vis[i]=1;G.exp[i]=1;};
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)mark(p.x+dx,p.y+dy);
 const r=roomAt(p.x,p.y);
 if(r){for(let y=r.y-1;y<=r.y+r.h;y++)for(let x=r.x-1;x<=r.x+r.w;x++)mark(x,y);
  if(r.mh&&!r.mhDone){r.mhDone=true;let n=0;G.mons.forEach(m=>{if(m.x>=r.x&&m.x<r.x+r.w&&m.y>=r.y&&m.y<r.y+r.h){m.sleep=0;m.deep=false;m.aware=true;n++;}});
   if(n){G.mhOn=true;msg('モンスターハウスだ！！');sfx('mh');FLASH=now();}}}}

function bfs(sx,sy){const w=G.w,h=G.h,d=new Int16Array(w*h).fill(9999),q=new Int32Array(w*h);let qh=0,qt=0;
 if(!passable(sx,sy))return d;d[sy*w+sx]=0;q[qt++]=sy*w+sx;
 while(qh<qt){const i=q[qh++],x=i%w,y=(i/w)|0,nd=d[i]+1;for(const [dx,dy] of DIRS){if(!canStep(x,y,dx,dy))continue;const j=(y+dy)*w+x+dx;if(d[j]>nd){d[j]=nd;q[qt++]=j;}}}
 return d;}

function tryMove(dx,dy,turnOnly){
 const p=G.p;
 if(G.mode==='town')return townMove(dx,dy,turnOnly);
 if(turnOnly){p.face=[dx,dy];return false;}
 let conf=false;if(p.confuse>0&&chance(0.6)){const d=pick(DIRS);dx=d[0];dy=d[1];conf=true;}
 p.face=[dx,dy];const nx=p.x+dx,ny=p.y+dy;
 if(monAt(nx,ny)||!canStep(p.x,p.y,dx,dy)){if(conf){msg('ふらふらして ぶつかった');endTurn();return true;}return false;}
 tween(p);p.x=nx;p.y=ny;onStep();endTurn();
 if(G.mode==='tower'&&!G.dying&&!MENU&&!DLG&&G.p===p&&isStairs(p.x,p.y)&&!(p.sleep>0))stairsPrompt();
 return true;}
function playerAttack(){
 const p=G.p;let dx=(p.face||[0,1])[0],dy=(p.face||[0,1])[1];
 if(p.confuse>0&&chance(0.6)){const d=pick(DIRS);dx=d[0];dy=d[1];p.face=[dx,dy];}
 p.atkT=now();const m=monAt(p.x+dx,p.y+dy);
 if(m&&adj(p.x,p.y,m.x,m.y))attack(m);else{if(m)msg('かべの かどが じゃまで とどかない');sfx('miss');}
 endTurn();}

function onStep(){
 const p=G.p,it=itemAt(p.x,p.y);
 if(it){if(it.gold){p.gold+=it.gold;msg(` ${it.gold}ゴールドを ひろった`);G.items=G.items.filter(x=>x!==it);sfx('coin');}
  else if(it.item.id==='heart')heartAsk(it);
  else if(p.inv.length<INV_MAX){p.inv.push(it.item);G.items=G.items.filter(x=>x!==it);msg(`${itemIcon(it.item)} ${itemName(it.item)}を ひろった`);sfx('pick');if(it.item.id==='book')onBook();}
  else msg(`${itemName(it.item)}が おちている。（もちものが いっぱい）`);}
 const tr=trapAt(p.x,p.y);if(tr)stepTrap(tr);
 if(G.mode!=='tower')return;
 if(isLight(p.x,p.y))returnHome('win');}

function stepTrap(t){
 const T=TRAPS[t.k];
 if(hasCollar('trap')){if(!t.seen){t.seen=true;msg(`${T.name}が あったけど、首輪が まもってくれた`);}return;}
 if(t.seen&&!chance(0.3))return;
 t.seen=true;msg(`カチッ… ${T.name}だ！`);sfx('trap');const p=G.p;
 switch(t.k){
  case 'spring':msg(G.down?'ぽよーん！ ころころと 下の階へ ころがりおちた！':'ぽよーん！ 上の階へ とばされた！');sfx('stairs');nextFloor();return;
  case 'sleep':if(hasCollar('awake'))msg('でも 首輪のおかげで ねむくならない');else{p.sleep=rr(3,6);msg('ねむくなって しまった… zzz');}break;
  case 'hungry':p.hunger=Math.max(0,p.hunger-10);msg('おなかが ぐぅ…と なった');break;
  case 'warp':warpPlayer();msg('ふわっと どこかへ とばされた');break;
  case 'spike':{const d=rr(4,8)+Math.floor(G.floor/2);msg(`とげが ちくっ！ ${d}の ダメージ`);fxText(p.x,p.y,d,'#ff7b8a');damagePlayer(d,'とげのわな');}break;
  case 'rust':{const c=eqOf('claw');if(c){c.plus--;msg(`${DB[c.id].name}が すこし まるくなった…`);}else msg('なにも おこらなかった');}break;
  case 'bark':G.mons.forEach(m=>{m.sleep=0;m.deep=false;m.aware=true;});msg('ワオーン…と こだまが ひびいて、モンスターたちが 目をさました');break;}}

function warpPlayer(){const t=randFree();if(t){G.p.x=t.x;G.p.y=t.y;computeVis();}}

function attack(m){
 const T=MT[m.t],sleeping=m.sleep>0;G.p.atkT=now();
 m.sleep=0;m.deep=false;m.aware=true;
 if(!sleeping&&!chance(0.93)){msg(`${T.name}に こうげき！ …はずれた`);sfx('miss');return;}
 const d=dmgCalc(pAtk(),m.def);m.hp-=d;fxText(m.x,m.y,d,'#ffffff');sfx('hit');
 msg(`${T.name}に ${d}の ダメージ！`);
 const c=eqOf('claw');if(c&&DB[c.id].special==='drain'&&G.p.hp<G.p.maxHp){const h=Math.min(G.p.maxHp-G.p.hp,1+Math.floor(d/6));G.p.hp+=h;}
 if(m.hp<=0)killMon(m);}
function killMon(m){
 const T=MT[m.t];G.mons=G.mons.filter(x=>x!==m);{const d=ACT_DELAY,f=()=>{burst(m.x,m.y,'#e8e0f4',16,1.6);ring(m.x,m.y,'#ffffff');};if(d>0&&!HEADLESS){GHOST.push({m,until:now()+d});setTimeout(f,d);}else f();}
 let e=m.exp;if(hasCollar('exp'))e=Math.round(e*1.5);
 if(T.ab==='heal')msg(`${T.name}は、しずかに きえていった。`);else msg(`${T.name}を たおした！ けいけんち ${e}`);gainExp(e);
 if(m.loot)dropItem(m.x,m.y,{item:m.loot});
 if(m.gold)dropItem(m.x,m.y,{gold:m.gold});
 if(T.boss){dropItem(m.x,m.y,{item:mkItem('h2')});}
 else if(chance(0.08))dropItem(m.x,m.y,{item:randItem(G.floor)});}
function dropItem(x,y,obj){
 for(let r=0;r<=3;r++){const c=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const nx=x+dx,ny=y+dy;
   if(!passable(nx,ny)||itemAt(nx,ny)||isStairs(nx,ny)||trapAt(nx,ny)||isLight(nx,ny))continue;c.push([nx,ny]);}
  if(c.length){const [cx,cy]=pick(c);G.items.push(Object.assign({x:cx,y:cy},obj));return true;}}
 if(obj.item)msg(`${itemName(obj.item)}は どこかへ きえてしまった`);return false;}

function damagePlayer(n,cause){const p=G.p;p.hp-=n;FLASH=now();if(p.hp<=0){p.hp=0;G.cause=cause;gameOver();}}

function endTurn(){
 if(G.mode!=='tower'||G.dying){updateUI();return;}
 const p=G.p;G.turn=(G.turn||0)+1;
 computeVis();
 hungerTick();if(G.dying){updateUI();return;}
 if(p.hunger>0&&p.hp<p.maxHp){p.rAcc=(p.rAcc||0)+p.maxHp/(hasCollar('regen')?55:110);while(p.rAcc>=1&&p.hp<p.maxHp){p.hp++;p.rAcc-=1;}}
 if(p.confuse>0){p.confuse--;if(!p.confuse)msg('あたまが すっきりした');}
 let monTurn=true;
 if(p.haste>0){p.haste--;p.hTog=!p.hTog;monTurn=!p.hTog;if(!p.haste)msg('あしの かるさが もとに もどった');}
 if(monTurn){monstersAct();if(G.dying||G.mode!=='tower'){updateUI();return;}}
 if(G.turn%40===0&&G.mons.length<14)spawnMon(G.floor,{hidden:true,far:true});
 computeVis();
 if(G.turn%20===0)save();
 updateUI();
 if(p.sleep>0){inputLock=true;setTimeout(sleepStep,170);}}
function sleepStep(){
 const p=G.p;if(G.dying||G.mode!=='tower'){inputLock=false;return;}
 p.sleep--;if(p.sleep<=0){p.sleep=0;p.sImm=G.turn+6;msg('はっと 目がさめた');inputLock=false;}
 endTurn();}
function hungerTick(){
 const p=G.p;p.hAcc=(p.hAcc||0)+1;let per=[14,10,8][dif()];if(hasCollar('hunger'))per*=2;const b=eqOf('band');if(b&&DB[b.id].special==='hunger')per=Math.round(per*1.5);
 if(p.hAcc>=per){p.hAcc=0;if(p.hunger>0){p.hunger--;
   if(p.hunger===20)msg('おなかが すいてきた…');if(p.hunger===10)msg('おなかが ぺこぺこだ…！');if(p.hunger===0)msg('おなかが すいて ふらふらする…！ なにか たべないと');}}
 if(p.hunger<=0)damagePlayer(1,'くうふく');}

/* ====================== モンスターAI ====================== */
function monstersAct(){
 dist=bfs(G.p.x,G.p.y);
 for(const m of G.mons.slice()){
  if(G.dying||G.mode!=='tower')return;
  const n=MT[m.t].speed||1;
  for(let k=0;k<n;k++){if(G.dying||!G.mons.includes(m))break;ACT_DELAY=k*100;monAct(m);}ACT_DELAY=0;}}
function monAct(m){
 const p=G.p,T=MT[m.t],seen=vis[m.y*G.w+m.x];
 if(m.sleep>0){
  if(m.deep){if((adj(m.x,m.y,p.x,p.y)&&chance(0.3))||(seen&&chance(0.03))){m.sleep=0;m.deep=false;}else return;}
  else{m.sleep--;return;}}
 if(seen){m.aware=true;m.lost=0;}else if(m.aware){m.lost++;if(m.lost>20)m.aware=false;}
 if(m.flee>0){m.flee--;stepAway(m);return;}
 if(T.ab==='heal'){kiokuAct(m);return;}
 if(adj(m.x,m.y,p.x,p.y)){monAttack(m);return;}
 if(T.ab==='breath'&&m.aware&&chance(0.3)&&lineClear(m,p,6)){breath(m);return;}
 if(m.aware)stepToward(m,dist);else wander(m);}
function stepToward(m,dm){
 const cur=dm[m.y*G.w+m.x];let best=[],bd=cur;
 for(const [dx,dy] of DIRS){const nx=m.x+dx,ny=m.y+dy;if(!canStep(m.x,m.y,dx,dy)||occupied(nx,ny))continue;const d=dm[ny*G.w+nx];
  if(d<bd){bd=d;best=[[nx,ny]];}else if(d===bd&&d<cur)best.push([nx,ny]);}
 if(best.length){const [nx,ny]=pick(best);tween(m,(MT[m.t].speed||1)>1?57:undefined);m.face=[nx-m.x,ny-m.y];m.x=nx;m.y=ny;return true;}return false;}
function stepAway(m){
 const cur=dist[m.y*G.w+m.x];let best=[],bd=cur;
 for(const [dx,dy] of DIRS){const nx=m.x+dx,ny=m.y+dy;if(!canStep(m.x,m.y,dx,dy)||occupied(nx,ny))continue;const d=dist[ny*G.w+nx];if(d>=9999)continue;
  if(d>bd){bd=d;best=[[nx,ny]];}else if(d===bd&&d>cur)best.push([nx,ny]);}
 if(best.length){const [nx,ny]=pick(best);tween(m,(MT[m.t].speed||1)>1?57:undefined);m.face=[nx-m.x,ny-m.y];m.x=nx;m.y=ny;}}
function wander(m){
 if(!m.tg||(m.x===m.tg[0]&&m.y===m.tg[1])||(m.stuck||0)>4){const r=pick(G.rooms);m.tg=[rr(r.x,r.x+r.w-1),rr(r.y,r.y+r.h-1)];m.stuck=0;}
 if(!stepToward(m,bfs(m.tg[0],m.tg[1])))m.stuck=(m.stuck||0)+1;}
function warpMon(m){const t=randFree(t=>cheb(t,G.p)>5);if(t){m.x=t.x;m.y=t.y;}}
function lineClear(m,p,maxd){const dx=p.x-m.x,dy=p.y-m.y;if(!(dx===0||dy===0||Math.abs(dx)===Math.abs(dy)))return false;const n=Math.max(Math.abs(dx),Math.abs(dy));if(n>maxd||n<2)return false;
 const sx=Math.sign(dx),sy=Math.sign(dy);let x=m.x,y=m.y;for(let i=1;i<n;i++){if(sx&&sy&&(!passable(x+sx,y)||!passable(x,y+sy)))return false;x+=sx;y+=sy;if(!passable(x,y)||monAt(x,y))return false;}return true;}
function breath_old(m){const d=rr(16,24),p=G.p;msg(`${MT[m.t].name}は わるい ゆめを はきだした！ ${d}の ダメージ`);fxText(p.x,p.y,d,'#ff7b8a');sfx('hurt');damagePlayer(d,MT[m.t].name);}
function monAttack(m){
 const p=G.p,T=MT[m.t];m.face=[Math.sign(p.x-m.x),Math.sign(p.y-m.y)];m.atkT=now()+ACT_DELAY;if(ACT_DELAY)ANIM=Math.max(ANIM,now()+ACT_DELAY+170);
 if(T.ab==='stealItem'&&!m.loot){const c=p.inv.filter(i=>!i.eq&&i.id!=='book');if(c.length&&chance(0.45)){const it=pick(c);removeInv(it);m.loot=it;msg(`${T.name}が ${itemName(it)}を くわえて とんでいった！`);sfx('steal');warpMon(m);m.flee=9999;return;}}
 if(T.ab==='stealGold'&&!m.gold&&p.gold>0&&chance(0.45)){const g=Math.min(p.gold,rr(20,60)+G.floor*10);p.gold-=g;m.gold=g;msg(`${T.name}が ${g}ゴールドを ぬすんで にげた！`);sfx('steal');warpMon(m);m.flee=9999;return;}
 if(!chance(0.87)){msg(`${T.name}の こうげき！ ひらりと かわした`);sfx('miss');return;}
 const d=dmgCalc(m.atk,pDef());msg(`${T.name}の こうげき！ ${d}の ダメージを うけた`);fxText(p.x,p.y,d,'#ff7b8a');sfx('hurt');
 damagePlayer(d,T.name);if(G.dying)return;
 if(hasCollar('thorn')){const r=Math.max(1,Math.round(d*0.3));m.hp-=r;msg(`とげの首輪が ${r}の ダメージを かえした`);if(m.hp<=0){killMon(m);return;}}
 if(chance(0.3))applyAbility(T);}
function applyAbility(T){const p=G.p;switch(T.ab){
 case 'poison':if(p.str>1){p.str--;msg('どくで ちからが さがった…');}break;
 case 'sleep':if(!hasCollar('awake')&&!(p.sleep>0)&&!((p.sImm||0)>G.turn)&&chance(0.6)){p.sleep=rr(2,3);msg('ふわふわの毛に つつまれて ねむってしまった… zzz');}break;
 case 'confuse':if(!hasCollar('awake')){p.confuse=rr(6,10);msg('あたまが くらくらして こんらんした！');}break;
 case 'hunger':p.hunger=Math.max(0,p.hunger-10);msg('おなかの なかみを すいとられた…！');break;
 case 'forget':G.exp.fill(0);G.mapped=false;computeVis();msg('あたまが ぼんやりして、ちずを わすれてしまった…');break;
 case 'ache':if(p.maxHp>10){p.maxHp--;p.hp=Math.min(p.hp,p.maxHp);msg('むねが ちくりと いたんだ… さいだいHPが へった');}break;}}

/* ====================== どうぐ ====================== */
function useItem(it){
 const d=DB[it.id];
 switch(d.cat){
  case 'food':eat(it);break;
  case 'herb':eatHerb(it);break;
  case 'amulet':if(!useAmulet(it))return;break;
  case 'claw':case 'band':case 'collar':toggleEquip(it);break;
  case 'ball':msg('ボールを くわえて しっぽを ふった。…なげたほうが いいかも');return;
  case 'book':msg('ひらいてみたけど、ぼくには 文字が よめない。');return;}
 endTurn();}
function healP(n,maxUp){const p=G.p;
 if(p.hp>=p.maxHp){if(maxUp){p.maxHp+=maxUp;p.hp=p.maxHp;msg(`さいだいHPが ${maxUp} あがった`);}}
 else{const h=Math.min(n,p.maxHp-p.hp);p.hp+=h;msg(`HPが ${h} かいふくした`);fxText(p.x,p.y,'+'+h,'#6fdc84');}
 sfx('heal');}
function eat(it){
 removeInv(it);const d=DB[it.id],p=G.p;msg(`${d.name}を もぐもぐ たべた`);sfx('eat');
 const before=p.hunger;p.hunger=Math.min(p.maxHunger,p.hunger+d.fill);
 if(before>=p.maxHunger-1){const up=it.id==='f2'?10:3;p.maxHunger=Math.min(200,p.maxHunger+up);p.hunger=p.maxHunger;msg(`おなかの 大きさが ${up} ふえた`);}
 else msg('おなかが ふくれた');
 if(d.heal)healP(d.heal,0);
 if(d.bad&&chance(0.6)){if(chance(0.5)){if(p.str>1)p.str--;msg('うっ… おなかが いたい。ちからが さがった');}else if(!hasCollar('awake')){p.confuse=rr(5,8);msg('うっ… めが まわる');}}}
function identify(id){G.known=G.known||{};if(!G.known[id]){G.known[id]=true;msg(`それは ${DB[id].name}だった！`);}}
function eatHerb(it){
 const p=G.p;msg(`${itemName(it)}を たべた`);removeInv(it);identify(it.id);if(p.hunger<p.maxHunger){const hf=Math.min(5,p.maxHunger-p.hunger);p.hunger+=hf;msg(`まんぷく度が ${hf} かいふくした`);}
 switch(it.id){
  case 'h1':healP(25,1);break;
  case 'h2':healP(100,2);break;
  case 'h3':if(p.str<p.maxStr){p.str=p.maxStr;msg('ちからが もとに もどった');}else{p.str++;p.maxStr++;msg(`ちからが ${p.str}に あがった！`);}sfx('heal');break;
  case 'h4':gainExp(Math.max(0,expFor(p.lv+1)-p.exp));break;
  case 'h5':if(p.str>1)p.str--;msg('にがい…！ ちからが さがった');damagePlayer(5,'にがいくさ');break;
  case 'h6':p.sleep=0;p.confuse=0;G.traps.forEach(t=>t.seen=true);msg('目が しゃっきりした。わなが 見えるようになった');break;
  case 'h7':if(hasCollar('awake'))msg('ねむくなりかけたけど、首輪が まもってくれた');else{p.sleep=rr(4,6);msg('ねむってしまった… zzz');}break;
  case 'h8':p.haste=20;msg('あしが かるくなった！');sfx('magic');break;}}
function toggleEquip(it){
 if(it.eq){it.eq=false;msg(`${itemName(it)}を はずした`);return;}
 const cur=eqOf(it.cat);if(cur)cur.eq=false;it.eq=true;msg(`${itemName(it)}を そうびした`);sfx('equip');}
function visibleMons(){return G.mons.filter(m=>vis[m.y*G.w+m.x]);}
function useAmulet(it){
 const p=G.p;msg(`${itemName(it)}を ぎゅっと にぎった…`);
 if(it.id==='a1'&&G.down){identify(it.id);msg('お守りは ふるえた。…でも、本が それを ゆるさない。');msg('かえり道は、じぶんの足で おりるしかない。');return false;}
 if(it.id==='a1'&&unknown(it)){identify(it.id);sfx('magic');openMenu({title:'かえりみちのお守りだ！',desc:'つかうと、あの子の ところへ かえる。\nもちものも お金も もちかえれる。',items:[{label:'かえる',fn:()=>{removeInv(it);msg('あたたかい光に つつまれた…');returnHome('amulet');}},{label:'まだ かえらない',fn:()=>{msg('お守りを だいじに しまった。');endTurn();}}],onCancel:()=>{msg('お守りを だいじに しまった。');endTurn();}});return false;}
 removeInv(it);identify(it.id);sfx('magic');
 switch(it.id){
  case 'a1':msg('あたたかい光に つつまれた…');returnHome('amulet');return false;
  case 'a2':{let n=0;G.mons.forEach(m=>{if(vis[m.y*G.w+m.x]||cheb(m,p)<=2){m.sleep=rr(8,12);m.deep=false;n++;}});msg(n?'モンスターたちは すやすや ねむった':'なにも おこらなかった');}break;
  case 'a3':{const vm=visibleMons();if(!vm.length){msg('やさしい光が ひろがった。でも だれも いなかった');break;}const dmg=20+G.floor*3;
   vm.forEach(m=>{m.hp-=dmg;m.aware=true;m.sleep=0;m.deep=false;fxText(m.x,m.y,dmg,'#fff7a0');msg(`${MT[m.t].name}に ${dmg}の ダメージ！`);if(m.hp<=0)killMon(m);});}break;
  case 'a4':for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){if(G.map[y*G.w+x]===0)continue;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<G.w&&ny<G.h)G.exp[ny*G.w+nx]=1;}}
   G.mapped=true;msg('フロアの ようすが あたまに うかんだ');break;
  case 'a5':warpPlayer();msg('ふわりと からだが うかんだ');onStepAfterWarp();break;
  case 'a6':{const c=eqOf('claw');if(c){c.plus++;msg(`${DB[c.id].name}が するどくなった！（+${c.plus}）`);}else msg('爪を そうびしていなかった…');}break;
  case 'a7':{const b=eqOf('band');if(b){b.plus++;msg(`${DB[b.id].name}が じょうぶになった！（+${b.plus}）`);}else msg('腹巻を そうびしていなかった…');}break;
  case 'a8':{const un=p.inv.filter(unknown);if(!un.length){msg('しらべるものが なかった');break;}
   openMenu({title:'なにを しらべる？',items:un.map(i=>({label:`${itemIcon(i)} ${itemName(i)}`,fn:()=>{identify(i.id);endTurn();}})),onCancel:()=>endTurn()});return false;}
  case 'a9':{if(!G.stairs&&!G.light){msg('なにも おこらなかった');break;}const s=G.stairs||G.light;let ok=false;
   for(const [dx,dy] of [[0,0]].concat(DIRS)){const x=s.x+dx,y=s.y+dy;if(passable(x,y)&&!monAt(x,y)&&!(dx===0&&dy===0&&G.light)){p.x=x;p.y=y;ok=true;break;}}
   if(ok){computeVis();msg(G.stairs?'かいだんの そばに きた':'光の そばに きた');}else msg('なにも おこらなかった');}break;
  case 'a10':{const vm=visibleMons();vm.forEach(m=>{m.flee=15;m.sleep=0;m.deep=false;});msg(vm.length?'モンスターたちは こわがって にげだした！':'なにも おこらなかった');}break;}
 return true;}
function onStepAfterWarp(){}
function startThrow(it){if(it.id==='book'){msg('これは だいじな本だ。なげられない');return;}inputMode='throw';pendingThrow=it;msg(`${itemName(it)}を なげる方向を えらんでね（Escで やめる）`);}
function throwItem_old(it,dx,dy){
 const p=G.p;if(it.eq)it.eq=false;removeInv(it);msg(`${itemName(it)}を なげた！`);
 let x=p.x,y=p.y,lx=x,ly=y;
 for(let i=0;i<10;i++){if(!canStep(x,y,dx,dy))break;x+=dx;y+=dy;const m=monAt(x,y);
  if(m){if(chance(0.9)){hitThrown(m,it);return;}msg('…はずれた');}lx=x;ly=y;}
 dropItem(lx,ly,{item:it});}
function hitThrown(m,it){
 const T=MT[m.t];m.aware=true;if(m.deep){m.sleep=0;m.deep=false;}
 let dmg=0;
 switch(it.id){
  case 'h1':m.hp=Math.min(m.maxHp,m.hp+25);msg(`${T.name}の HPが かいふくしてしまった`);identify(it.id);return;
  case 'h2':m.hp=m.maxHp;msg(`${T.name}は げんきいっぱいに なった`);identify(it.id);return;
  case 'h5':dmg=10+G.floor;m.atk=Math.max(1,Math.round(m.atk*0.8));msg(`${T.name}は にがくて よわった`);identify(it.id);break;
  case 'h7':m.sleep=10;m.deep=false;msg(`${T.name}は ねむってしまった`);identify(it.id);return;
  default:
   if(it.cat==='ball')dmg=10+Math.floor(G.floor*1.5);

【ルール】
・いどうと こうげきは べつ。モンスターの ほうを むいて Enter。
・こちらが 1回 うごくと モンスターも うごく。かべの かどは ななめに こえられない。
・まんぷく度が 0 になると HPが へる。
・爪＝ぶき、腹巻＝ぼうぐ、首輪＝つけている あいだ ずっと 効く。
・お守りと くさは、つかうまで 正体が わからない。
・なげる ときは、むいている ほうへ とぶ。
・かえりみちのお守りで、どうぐも お金も もちかえれる。ただし 奥義を 手にしたら もう つかえない。
・塔は 25階より 上にも つづいている。25階から 上は どの階にも しあわせの奥義が あり、どれを 手にしても よい（敵の つよさは 25階と おなじ）。
・奥義は おくことも なげることも できない。
・たおれると あの子のところへ。お金は はんぶん、どうぐは なくなる。
・むずかしさは 3だんかい。あの子に はなすと いつでも かえられる。
・お金を ためて 犬小屋を ひろげると、どうぐを さいだい3こ もちこめる。`;

/* ====================== 飛び道具 ====================== */
const PROJ=[];let PROJ_HIT=false,GHOST=[],HP_PEND=[];
function hpPend(){const t=now();HP_PEND=HP_PEND.filter(q=>q.t>t);return HP_PEND.reduce((s,q)=>s+q.n,0);}
function shoot(kind,x0,y0,x1,y1,it){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1,dur=kind==='fire'?Math.min(460,140+n*55):Math.min(420,90+n*42),t0=now()+ACT_DELAY;
 PROJ.push({kind,x0,y0,x1,y1,t0,dur,it});ANIM=Math.max(ANIM,t0+dur+40);if(!HEADLESS)setTimeout(()=>sfx(kind==='fire'?'fire':'throw'),Math.max(0,t0-now()));requestRender();return dur;}
function drawProj(){const t=now();
 for(let i=PROJ.length-1;i>=0;i--){const q=PROJ[i],u=(t-q.t0)/q.dur;if(u>1){PROJ.splice(i,1);continue;}if(u<0)continue;
  const at=v=>[(q.x0+(q.x1-q.x0)*v)*32+16-camX,(q.y0+(q.y1-q.y0)*v)*32+16-camY];
  if(q.kind==='light'){const [x,y]=at(u);for(let k=6;k>=1;k--){const [tx,ty]=at(Math.max(0,u-k*0.05));L.fillStyle=`rgba(255,255,255,${(0.5-k*0.07).toFixed(2)})`;L.beginPath();L.arc(tx,ty,Math.max(1,5-k*0.6),0,6.3);L.fill();}
   const gg=L.createRadialGradient(x,y,0,x,y,14);gg.addColorStop(0,'rgba(255,255,255,.95)');gg.addColorStop(0.4,'rgba(220,240,255,.55)');gg.addColorStop(1,'rgba(220,240,255,0)');L.fillStyle=gg;L.fillRect(x-14,y-14,28,28);L.fillStyle='#ffffff';L.beginPath();L.arc(x,y,3.5,0,6.3);L.fill();}
  else if(q.kind==='fire'){
   for(let k=7;k>=1;k--){const v=Math.max(0,u-k*0.045),[x,y]=at(v),r=Math.max(1.5,9-k*0.9+Math.sin(t/40+k)*0.8);L.fillStyle=`rgba(${255},${Math.max(60,190-k*18)},${Math.max(30,90-k*8)},${(0.7-k*0.07).toFixed(2)})`;L.beginPath();L.arc(x+(Math.random()-0.5)*2,y+(Math.random()-0.5)*2,r,0,6.3);L.fill();}
   const [x,y]=at(u);L.fillStyle='rgba(255,140,60,.55)';L.beginPath();L.arc(x,y,11+Math.sin(t/30)*1.2,0,6.3);L.fill();L.fillStyle='#ffd25a';L.beginPath();L.arc(x,y,7.5,0,6.3);L.fill();L.fillStyle='#fff6d0';L.beginPath();L.arc(x,y,4,0,6.3);L.fill();
   if(Math.random()<0.6)PT.push({x:(q.x0+(q.x1-q.x0)*u)*32+16,y:(q.y0+(q.y1-q.y0)*u)*32+16,vx:(Math.random()-0.5)*0.8,vy:-0.4-Math.random()*0.6,t,life:300+Math.random()*200,col:Math.random()<0.5?'#ffb347':'#ff7043',s:2,g:-0.004});
  }else{
   const [x,y]=at(u),hgt=Math.sin(u*Math.PI)*12;L.fillStyle='rgba(0,0,0,.25)';L.beginPath();L.ellipse(x,y+10,6*(1-hgt/30),2.2,0,0,6.3);L.fill();
   const s=itemSpr(q.it),sz=24,ang=(q.it&&q.it.cat==='ball')?u*9:Math.sin(u*Math.PI*2)*0.5;L.save();L.translate(Math.round(x),Math.round(y-hgt));L.rotate(ang);L.drawImage(s,-sz/2,-sz/2,sz,sz);L.restore();}}
 requestRender();}
function throwItem(it,dx,dy){
 const p=G.p;if(it.eq)it.eq=false;removeInv(it);msg(`${itemName(it)}を なげた！`);p.face=[dx,dy];
 let x=p.x,y=p.y,lx=x,ly=y,hit=null;
 for(let i=0;i<10;i++){if(!canStep(x,y,dx,dy))break;x+=dx;y+=dy;const m=monAt(x,y);
  if(m){if(chance(0.9)){hit=m;break;}msg('…はずれた');}lx=x;ly=y;}
 const d=shoot('item',p.x,p.y,hit?hit.x:lx,hit?hit.y:ly,it),old=ACT_DELAY;ACT_DELAY=old+d;PROJ_HIT=true;const hp0=hit?hit.hp:0,items0=new Set(G.items);
 try{if(hit){hitThrown(hit,it);const lost=hp0-hit.hp;if(lost>0){hit.pd={n:lost,t:now()+ACT_DELAY};if(!HEADLESS)setTimeout(requestRender,d+10);}G.items.forEach(g=>{if(!items0.has(g))g.hid=now()+ACT_DELAY;});}else{dropItem(lx,ly,{item:it});const f=G.items.find(g=>g.item===it);if(f)f.hid=now()+d;}}finally{ACT_DELAY=old;PROJ_HIT=false;}}
function breath(m){const dd=rr(16,24),p=G.p;m.face=[Math.sign(p.x-m.x),Math.sign(p.y-m.y)];m.atkT=now()+ACT_DELAY;
 msg(`${MT[m.t].name}は わるい ゆめを はきだした！ ${dd}の ダメージ`);
 const d=shoot('fire',m.x,m.y,p.x,p.y),old=ACT_DELAY;ACT_DELAY=old+d;PROJ_HIT=true;
 try{fxText(p.x,p.y,dd,'#ff7b8a');if(!HEADLESS)setTimeout(()=>{burst(p.x,p.y,'#ffb347',14,1.4);sfx('hurt');},d);HP_PEND.push({n:Math.min(dd,p.hp),t:now()+ACT_DELAY});if(!HEADLESS)setTimeout(updateUI,d+10);damagePlayer(dd,MT[m.t].name);}finally{ACT_DELAY=old;PROJ_HIT=false;}}
